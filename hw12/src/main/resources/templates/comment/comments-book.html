<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Comments</title>
    <style>
        body {
            padding: 50px;
        }

        .comments {
            border: 1px solid steelblue;
            width: 300px;
            border-collapse: collapse;
        }

        .comments tr td, th {
            padding: 5px;
            border: 1px solid steelblue;
        }

        .comments td:last-child, td:first-child {
            width: 50px;
        }
    </style>
    <script src="/webjars/jquery/3.7.1/jquery.min.js"></script>
</head>
<body>
    <div>
        <a href="/book" >BACK</a>
    </div>
    <h3>COMMENTS</h3>
    <table id="comment-table" class="comments">
        <thead>
        <tr>
            <th>ID</th>
            <th>BOOK</th>
            <th>TEXT</th>
        </tr>
        </thead>
        <tbody>
        </tbody>
    </table>
    <script>
        function getBookComments() {
            let url = document.URL
            let bookId = url.substring(url.lastIndexOf('/') + 1)
            fetch(`/api/comment/book/${bookId}`)
                .then(response => response.json())
                .then(json => addToBookCommentsTable(json));
        }
        function addToBookCommentsTable(data){
            for(let i=0; i< data.length; i++){
                let obj = data[i];
                $('tbody').append(`<tr id="${obj.id}">
                                        <td> ${obj.id} </td>
                                        <td> ${obj.book.title} </td>
                                        <td> ${obj.text} </td>
                                       </tr>`)
            }
        }
        getBookComments();
    </script>
</body>
</html>
