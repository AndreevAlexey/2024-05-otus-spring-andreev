<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Book list</title>
    <style>
        body {
            padding: 50px;
        }

        .books {
            border: 1px solid steelblue;
            width: 300px;
            border-collapse: collapse;
        }

        .books tr td, th {
            padding: 5px;
            border: 1px solid steelblue;
        }

        .books td:last-child, td:first-child {
            width: 50px;
        }
    </style>
    <script src="/webjars/jquery/3.7.1/jquery.min.js"></script>
</head>
<body>
    <div class="row">
        <a href="/logout" >LOG OUT</a>
    </div>
    <div>
        <a href="/" >HOME</a>
    </div>
    <h3>BOOKS</h3>
    <table id="book-table" class="books">
        <thead>
            <tr>
                <th>ID</th>
                <th>TITLE</th>
                <th>AUTHOR</th>
                <th>GENRE</th>
                <th>COMMENTS</th>
                <th>edit</th>
                <th>delete</th>
            </tr>
        </thead>

        <tbody>
        </tbody>
    </table>
    <div>
        <a href="/book/add" >* add book</a>
    </div>
    <script>
        function getBooks() {
            fetch("/api/book")
                .then(response => response.json())
                .then(json => addToBookTable(json));
        }
        function addToBookTable(data){
            for(let i=0; i< data.length; i++){
                let obj = data[i];
                $('tbody').append(`<tr id="${obj.id}">
                                    <td> ${obj.id} </td>
                                    <td> ${obj.title} </td>
                                    <td> ${obj.author.fullName} </td>
                                    <td> ${obj.genre.name} </td>
                                    <td>
                                        <a href="/comment/book/${obj.id}" >comments</a>
                                    </td>
                                    <td>
                                        <a href="/book/edit/${obj.id}" >edit</a>
                                    </td>
                                    <td>
                                        <button onclick="deleteBook(${obj.id})">delete</button>
                                    </td>
                                   </tr>`)
            }
        }
        getBooks();
    </script>
    <script>
        function deleteBook(id) {
            fetch(`/api/book/${id}`, {
                method: 'DELETE'
            })
                .then(response => {
                    if (response.ok) {
                        $('#' + id).remove();
                    }
                })
        }
    </script>
</body>
</html>
