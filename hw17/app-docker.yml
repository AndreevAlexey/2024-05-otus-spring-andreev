server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  sql:
    init:
      mode: never
      data-locations: data.sql
      schema-locations: schema.sql

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    open-in-view: false
    generate-ddl: false

  flyway:
    enabled: true
    locations: classpath:/db/migration/postgres

  data:
    rest:
      base-path: /data-rest

resilience4j.circuitbreaker:
  configs:
    default:
      slidingWindowSize: 10
      permittedNumberOfCallsInHalfOpenState: 3
      slowCallDurationThreshold: 4s
      slowCallRateThreshold: 1
      failureRateThreshold: 1
      waitDurationInOpenState: 5s
      minimumNumberOfCalls: 5
  instances:
    library:
      baseConfig: default
      slidingWindowSize: 10

resilience4j.retry:
  configs:
    default:
      maxAttempts: 3
      waitDuration: 100ms
      retryExceptions:
        - org.springframework.web.client.HttpServerErrorException
        - java.util.concurrent.TimeoutException
        - java.io.IOException
  instances:
    library:
      baseConfig: default

management:
  endpoint:
    shutdown:
      enabled: true
    health:
      show-details: always
    logfile:
      external-file: logs/library-log.txt
  endpoints:
    web:
      exposure:
        include: "*"

logging:
  file:
    name: logs/library-log.txt
  level:
    root: info
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"


