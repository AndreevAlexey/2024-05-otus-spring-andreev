<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Genres</title>
    <style>
        body {
            padding: 50px;
        }

        .genres {
            border: 1px solid steelblue;
            width: 300px;
            border-collapse: collapse;
        }

        .genres tr td, th {
            padding: 5px;
            border: 1px solid steelblue;
        }

        .genres td:last-child, td:first-child {
            width: 50px;
        }
    </style>
    <script src="/webjars/jquery/3.7.1/jquery.min.js"></script>
</head>
<body>
    <div>
        <a href="/" >HOME</a>
    </div>
    <h3>GENRES</h3>
    <table class="genres">
        <thead>
            <tr>
                <th>ID</th>
                <th>NAME</th>
            </tr>
        </thead>
        <tbody>
        </tbody>
    </table>
    <script>
        function getGenres() {
            fetch("/api/genre")
                .then(response => response.json())
                .then(json => addToTable(json));
        }
        function addToTable(data){
            for(let i=0; i< data.length; i++){
                let obj = data[i];
                $('tbody').append(`<tr>
                                    <td> ${obj.id} </td>
                                    <td> ${obj.name} </td>
                                   </tr>`)
            }
        }
        getGenres();
    </script>
</body>
</html>
