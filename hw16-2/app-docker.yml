server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  sql:
    init:
      mode: never
      data-locations: data.sql
      schema-locations: schema.sql

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    open-in-view: false
    generate-ddl: false

  flyway:
    enabled: true
    locations: classpath:/db/migration/postgres

  data:
    rest:
      base-path: /data-rest

management:
  endpoint:
    shutdown:
      enabled: true
    health:
      show-details: always
    logfile:
      external-file: logs/library-log.txt
  endpoints:
    web:
      exposure:
        include: "*"

logging:
  file:
    name: logs/library-log.txt
  level:
    root: info
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"


