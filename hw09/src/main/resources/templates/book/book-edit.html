<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit book</title>
    <style>
        body {
            padding: 50px;
        }

        label {
            display: inline-block;
            width: 100px;
        }

        input:read-only {
            background: lightgray;
        }

        .row {
            margin-top: 10px;
        }

    </style>
</head>
<body>
    <form id="edit-book-form" action="book-edit.html" th:method="post" th:action="@{/book/update/__${book.id}__}" th:object="${book}">
        <h3>Book info:</h3>

        <div class="row">
            <label for="id-input">ID:</label>
            <input id="id-input" type="text" readonly="readonly" value="0" th:value="*{id}"/>
        </div>

        <div class="row">
            <label for="book-title-input">TITLE:</label>
            <input id="book-title-input" name="title" type="text" value="" th:value="*{title}"/>
        </div>

        <div class="row">
            <label for="book-author-selector">AUTHOR:</label>
            <select th:field="*{author}" class="form-control" id="book-author-selector">
                <option th:each="author : ${authors}"
                        th:value="${author.id}"
                        th:text="${author.getFullName()}">

                </option>
            </select>
        </div>

        <div class="row">
            <label for="book-genre-selector">GENRE:</label>
            <select th:field="*{genre}" class="form-control" id="book-genre-selector">
                <option th:each="genre : ${genres}" th:value="${genre.id}" th:text="${genre.getName()}"></option>
            </select>
        </div>

        <div class="row">
            <button type="submit">Save</button>
            <a href="books.html" th:href="@{/books}"><button type="button">Cancel</button></a>
        </div>
    </form>
</body>
</html>
