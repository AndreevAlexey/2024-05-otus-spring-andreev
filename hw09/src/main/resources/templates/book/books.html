<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Book list</title>
    <style>
        body {
            padding: 50px;
        }

        .books {
            border: 1px solid steelblue;
            width: 300px;
            border-collapse: collapse;
        }

        .books tr td, th {
            padding: 5px;
            border: 1px solid steelblue;
        }

        .books td:last-child, td:first-child {
            width: 50px;
        }
    </style>
</head>
<body>
    <div>
        <a href="../main.html" th:href="@{/}">HOME</a>
    </div>
    <h3>BOOKS</h3>
    <table class="books">
        <tr>
            <th>ID</th>
            <th>TITLE</th>
            <th>AUTHOR</th>
            <th>GENRE</th>
            <th>COMMENTS</th>
            <th>edit</th>
            <th>delete</th>
        </tr>

        <tbody>
            <tr th:each="book : ${books}">
                <td th:text="${book.id}">0</td>
                <td th:text="${book.title}">""</td>
                <td th:text="${book.author.getFullName()}">""</td>
                <td th:text="${book.genre.getName()}">""</td>
                <td>
                    <a href="book-comments.html" th:href="@{/comments/book/__${book.id}__}">view</a>
                </td>
                <td>
                    <a href="book-edit.html" th:href="@{/book/edit/__${book.id}__}">edit</a>
                </td>
                <td>
                    <a href="books.html" th:href="@{/book/delete/__${book.id}__}">delete</a>
                </td>
            </tr>
        </tbody>
    </table>
    <div>
        <a href="book-add.html" th:href="@{/book/add}">* add book</a>
    </div>
</body>
</html>
